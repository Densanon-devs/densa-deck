[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "densa-deck"
version = "0.6.0"
description = "MTG deck analysis, goldfish testing, matchup simulation, and player insight engine"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "httpx>=0.27",
    "rich>=13.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]
desktop = [
    "pyinstaller>=6.0",
    # GUI shell for the desktop app (Stage A). pywebview wraps a native
    # OS webview + exposes a Python API to the HTML/JS frontend. Smaller
    # than Electron (~20 MB overhead vs ~150 MB) and doesn't need a
    # separate browser runtime. Optional — CLI still works without it.
    "pywebview>=5.0",
]
analyst = [
    # Local GGUF inference for the LLM analyst layer. Optional — the analyst
    # falls back to MockBackend if this isn't installed.
    "llama-cpp-python>=0.3",
]
mcp = [
    # Model Context Protocol SDK — only needed when running
    # `densa-deck mcp serve`. The desktop bundle includes it (so paying
    # customers get the MCP server by default); CLI-only installs can
    # skip it.
    #
    # Upper bound is deliberate: mcp 2.0 removed `mcp.server.fastmcp`, which
    # `mcp/server.py` imports, so an unbounded `>=1.0` resolves to a version
    # where the MCP server cannot start. Raise this only after porting to
    # the 2.x API.
    "mcp>=1.0,<2.0",
]

[project.scripts]
densa-deck = "densa_deck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Bundle the desktop app's HTML/CSS/JS so it ships inside the wheel and
# the PyInstaller frozen binary finds them at STATIC_DIR.
# Note: static/*.js covers app.js, tour.js, builder.js and collection.js.
"densa_deck.app" = ["static/*.html", "static/*.css", "static/*.js",
                    "static/phone/*.html", "static/phone/*.css",
                    "static/phone/*.js"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

# Everything that flags a probable defect — F (pyflakes), I (imports),
# W (warnings) and the rest of E — is enforced and currently clean. The
# three rules below are style preferences this codebase has never followed,
# and enforcing them now would mean ~350 lines of reformatting across files
# with no behaviour change, which buries `git blame` for no benefit.
ignore = [
    # 326 pre-existing violations, median 8 characters over the limit. To
    # take this on, run `ruff format` as its own commit rather than
    # hand-wrapping — then drop this ignore.
    "E501",   # line-too-long
    # `if name: query["name"] = name` — a compact, readable idiom used
    # deliberately when building option dicts.
    "E701",   # multiple-statements-on-one-line (colon)
    "E702",   # multiple-statements-on-one-line (semicolon)
]

[tool.ruff.lint.per-file-ignores]
# Benchmark decklists are data, not code: long lines are inherent to the
# card names and this file accounts for 96 of the E501 violations alone.
"src/densa_deck/benchmarks/analyst_gauntlet_decks.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    # Tests that talk to a live external API. Excluded in CI so a slow or
    # unhappy Scryfall can't fail a build; run locally with `-m network`
    # when touching ingest.
    "network: requires network access to a third-party API",
]
