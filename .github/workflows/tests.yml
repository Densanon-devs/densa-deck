name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject declares requires-python >= 3.11.
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Run tests
        # The suite is offline by design; anything needing the network is
        # marked `network` and skipped here so CI can't fail on Scryfall
        # being slow. Run those locally with `-m network`.
        run: python -m pytest tests/ -q -m "not network"
        env:
          PYTHONPATH: src
